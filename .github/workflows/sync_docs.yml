name: Sync Main to Documentation
on:
  push:
    branches:
      - main  # This triggers the script whenever main is updated

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so we can merge

      - name: Merge main into Documentation
        run: |
          # 1. Identity the "Bot" as the author
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Switch to the Documentation branch
          git checkout Documentation
          
          # 3. Pull the new stuff from main
          # --no-ff ensures a merge commit is created
          git merge main --no-ff -m "Autosync: Merged main into Documentation"
          
          # 4. Push the updated Documentation branch back to GitHub
          git push origin Documentation